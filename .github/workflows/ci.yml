name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: 20

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npm run lint
      - run: npm run typecheck
        env:
          VITE_API_URL: http://127.0.0.1:4000

  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npm test
        env:
          MONGODB_URI: mongodb://localhost:27017/utopiahire-test
          JWT_SECRET: test-secret-that-is-at-least-16-chars
          NODE_ENV: test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build Docker images
        env:
          # `docker compose build` parses the full compose file, which requires
          # these variables even though only image build is performed (no run).
          MONGO_ROOT_PASSWORD: ci-build-dummy-password
          JWT_SECRET: ci-build-dummy-secret-at-least-16-chars
          OPENAI_API_KEY: sk-ci-dummy
          STRIPE_SECRET_KEY: sk_test_ci_dummy
          STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
          STRIPE_PRICE_ID_PRO: price_ci_dummy
          RESEND_API_KEY: re_ci_dummy
          FRONTEND_URL: http://localhost:5173
          CORS_ORIGIN: http://localhost:5173
        run: |
          docker compose build
